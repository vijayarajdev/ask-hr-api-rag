version: '3.8'

services:
  api:
    build: .
    ports:
      - "8088:8000"
    env_file:
      - .env
    # Override the Dockerfile CMD to enable hot-reloading for local dev
    #command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/code/app                # Hot-reload code during development
      - ./data:/code/data              # Persistent Vector Store & Policies
    restart: always